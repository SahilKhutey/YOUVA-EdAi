name: Phase 8 — Autonomous AI Maturity Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'phase8/**'
      - 'docs/phase8/**'
      - '.github/workflows/phase8.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'phase8/**'
      - 'docs/phase8/**'
      - '.github/workflows/phase8.yml'

jobs:
  validate-phase8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: Run Phase 8 Exit Gate Validation
        run: |
          python phase8/scripts/validate_phase8_gate.py

      - name: Run Phase 8 Autonomy Unit & Invariant Test Suite
        run: |
          pytest phase8/tests/ -v

      - name: Run Full Regression Suite (Phase 0 - 9, Final)
        run: |
          pytest -v
