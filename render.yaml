services:
  - type: web
    name: youva-edai-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youva-edai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://your-vercel-domain.vercel.app"
      - key: PORT
        value: "3001"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: youva-edai-db
    plan: free
