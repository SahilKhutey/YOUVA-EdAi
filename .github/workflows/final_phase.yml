name: YOUVA EdAI Final Phase & Master Release Gate

on:
  push:
    paths:
      - "final_phase/**"
      - "docs/final_phase/**"
      - ".github/workflows/final_phase.yml"

  pull_request:
    paths:
      - "final_phase/**"
      - "docs/final_phase/**"
      - ".github/workflows/final_phase.yml"

jobs:
  final_phase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: Run Final Phase Operational Test Suite (FP-V001 - FP-V034)
        run: |
          python -m pytest final_phase/tests -v

      - name: Run All Repository Test Suites (Phase 0, 9, Final)
        run: |
          python -m pytest phase0/tests phase9/tests final_phase/tests -v

      - name: Run Master Production Release Gate (GO / NO-GO)
        run: |
          python final_phase/scripts/validate_release_gate.py
