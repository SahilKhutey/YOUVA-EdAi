name: Phase 6 — Kindergarten & Junior Tier Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'phase6/**'
      - 'docs/phase6/**'
      - '.github/workflows/phase6.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'phase6/**'
      - 'docs/phase6/**'
      - '.github/workflows/phase6.yml'

jobs:
  validate-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: Run Phase 6 Exit Gate Validation
        run: |
          python phase6/scripts/validate_phase6_gate.py

      - name: Run Phase 6 Junior Simulation
        run: |
          python phase6/scripts/run_junior_simulation.py

      - name: Run Full Regression Suite (Phase 0 - 6, 9, Final)
        run: |
          pytest phase0/tests phase1/tests phase2/tests phase3/tests phase4/tests phase5/tests phase6/tests phase9/tests final_phase/tests -v
