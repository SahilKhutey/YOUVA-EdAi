name: YOUVA EdAI Phase 1

on:
  push:
    paths:
      - "phase1/**"
      - "docs/phase1/**"
      - ".github/workflows/phase1.yml"

  pull_request:
    paths:
      - "phase1/**"
      - "docs/phase1/**"
      - ".github/workflows/phase1.yml"

jobs:
  phase1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: Run Phase 1 unit tests
        run: |
          python -m pytest phase1/tests -v

      - name: Run Phase 1 Exit Gate
        run: |
          python phase1/scripts/validate_phase1_gate.py
