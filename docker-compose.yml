version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: youva
      POSTGRES_USER: youva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youvapassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://youva:${POSTGRES_PASSWORD:-youvapassword}@postgres:5432/youva
      JWT_SECRET: ${JWT_SECRET:-production_secure_secret_with_32_chars_minimum!}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"

volumes:
  postgres_data:
