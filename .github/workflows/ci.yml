name: CI / Production Build & Policy Verification Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-verification:
    name: Backend Build, Database Integration, Schema Validation & E2E Suites
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: youva
          POSTGRES_USER: youva
          POSTGRES_PASSWORD: youvapassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U youva -d youva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://youva:youvapassword@localhost:5432/youva
      JWT_SECRET: test-secret-key-that-is-at-least-32-characters-long
      REDIS_URL: redis://localhost:6379
      TELEMETRY_SALT: youva-ci-telemetry-salt-2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck Backend TypeScript
        working-directory: backend
        run: npm run typecheck

      - name: Lint Backend Codebase
        working-directory: backend
        run: npm run lint

      - name: Validate Prisma Schema & Generate Client
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply Prisma Migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: backend
        run: npx prisma db seed

      - name: Compile Backend TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Core Human–AI Learning Loop, Configuration & Security Verification Suites
        working-directory: backend
        run: npm test -- src/learning-loop src/teacher-ops src/parent src/safety src/health src/security src/telemetry src/practice src/ai src/config src/learning/ src/learning-engine/

      - name: Run Full Application E2E
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm run test:e2e -- --runInBand

  frontend-verification:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Browser Tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          BASE_URL: http://localhost:3000
        run: npx playwright test --project=chromium
        continue-on-error: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

