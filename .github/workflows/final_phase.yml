name: Final Phase — Continuous Governance & Production Release Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'final_phase/**'
      - 'docs/final_phase/**'
      - '.github/workflows/final_phase.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'final_phase/**'
      - 'docs/final_phase/**'
      - '.github/workflows/final_phase.yml'

jobs:
  validate-final-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: Run Master Production Release Gate (GO / NO-GO)
        run: |
          python final_phase/scripts/validate_release_gate.py

      - name: Run Final Phase 18-Step Production Execution Procedure
        run: |
          python final_phase/scripts/run_fp_execution_procedure.py

      - name: Run Final Phase Unit & Integration Test Suite
        run: |
          pytest final_phase/tests/ -v

      - name: Run Full Repository Regression Suite (Phase 0 - 9, Final Phase)
        run: |
          pytest -v
