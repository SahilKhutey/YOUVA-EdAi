name: Phase 7 — Scale Infrastructure & Multi-Tenant Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'phase7/**'
      - 'docs/phase7/**'
      - '.github/workflows/phase7.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'phase7/**'
      - 'docs/phase7/**'
      - '.github/workflows/phase7.yml'

jobs:
  validate-phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: Run Phase 7 Exit Gate Validation
        run: |
          python phase7/scripts/validate_phase7_gate.py

      - name: Run Phase 7 Unit & Invariant Test Suite
        run: |
          pytest phase7/tests/ -v

      - name: Run Full Regression Suite (Phase 0 - 7, 9, Final)
        run: |
          pytest -v
