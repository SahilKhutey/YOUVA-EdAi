name: Phase 2 — Safety & Trust Hardening Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'phase2/**'
      - 'backend/src/consent/**'
      - 'backend/src/audit/**'
      - 'backend/src/safety/**'
      - 'docs/phase2/**'
      - '.github/workflows/phase2.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'phase2/**'
      - 'backend/src/consent/**'
      - 'backend/src/audit/**'
      - 'backend/src/safety/**'
      - 'docs/phase2/**'
      - '.github/workflows/phase2.yml'

jobs:
  validate-phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: Run Phase 2 Exit Gate Validation
        run: |
          python phase2/scripts/validate_phase2_gate.py

      - name: Run Phase 2 Interactive Simulation
        run: |
          python phase2/scripts/run_safety_audit.py

      - name: Run Full Pytest Regression (Phase 0, 1, 2, 9, Final Phase)
        run: |
          pytest phase0/tests phase1/tests phase2/tests phase9/tests final_phase/tests -v
