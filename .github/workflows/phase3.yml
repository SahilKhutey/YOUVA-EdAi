name: Phase 3 — Classroom Closed Pilot Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'phase3/**'
      - 'docs/phase3/**'
      - '.github/workflows/phase3.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'phase3/**'
      - 'docs/phase3/**'
      - '.github/workflows/phase3.yml'

jobs:
  validate-phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: Run Phase 3 Exit Gate Validation
        run: |
          python phase3/scripts/validate_phase3_gate.py

      - name: Run Phase 3 Simulation
        run: |
          python phase3/scripts/run_pilot_simulation.py

      - name: Run Full Regression Suite (Phase 0 - 3, 9, Final)
        run: |
          pytest phase0/tests phase1/tests phase2/tests phase3/tests phase9/tests final_phase/tests -v
