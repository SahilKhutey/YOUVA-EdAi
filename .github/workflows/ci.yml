name: CI / Production Build & Policy Verification Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-verification:
    name: Backend Build, Schema Validation & Learning Loop Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate & Generate Prisma Schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
        run: |
          npx prisma validate
          npx prisma generate

      - name: Compile Backend TypeScript
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
        run: npm run build

      - name: Run Core Human–AI Learning Loop & Security Verification Suites
        working-directory: backend
        env:
          JWT_SECRET: test-secret-key-that-is-at-least-32-characters-long
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
        run: npm test -- src/learning-loop src/teacher-ops src/parent src/safety src/health src/security

  frontend-verification:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build
